# Kumpulan request uji untuk scripts/04_evaluate.py.
# Dijalankan BERURUTAN dalam satu sesi (riwayat putar ikut berlaku), seperti saat live.
#
# Kolom `expect` (semua opsional) dicek otomatis:
#   type        : jenis intent yang diharapkan (explicit_song | mood_request | not_a_request)
#   song        : judul lagu yang harus terpilih
#   artist      : artis lagu yang harus terpilih
#   not_song    : judul yang TIDAK boleh terpilih (mis. karena cooldown)
#   energy      : energi lagu terpilih (rendah | sedang | tinggi)
#   language    : bahasa lagu terpilih (id | en)
#   moderation  : true bila komentar harus ditandai perlu moderasi
#   no_song     : true bila tidak boleh ada lagu yang direkomendasikan
# Kualitas pilihan lagu & host_line tetap dinilai manual (kolom "nilai manual" di laporan).

- category: eksplisit
  comment: "kak puterin hati2 dijalan nya tulus dong 🥺🙏"
  expect: {type: explicit_song, song: "Hati-Hati di Jalan"}

- category: eksplisit
  comment: "req perfect ed sheeran plsss"
  expect: {type: explicit_song, song: "Perfect"}

- category: eksplisit
  comment: "lagu dewa19 dong bang yg kangen"
  expect: {type: explicit_song, song: "Kangen"}

- category: eksplisit
  comment: "puterin sheila on 7 dong yg sebuah kisah klasik, besok wisuda 🎓"
  expect: {type: explicit_song, song: "Sebuah Kisah Klasik"}

- category: eksplisit (hanya artis)
  comment: "puterin lagu ed sheeran dong, lagi kasmaran nih hehe"
  expect: {type: explicit_song, artist: "Ed Sheeran"}

- category: eksplisit (tidak ada di katalog)
  comment: "req lathi weird genius dong kak 🔥"
  expect: {type: explicit_song}

- category: eksplisit (cooldown)
  comment: "kak puterin hati hati di jalan lagi dong, td telat masuk live"
  expect: {type: explicit_song, not_song: "Hati-Hati di Jalan"}

