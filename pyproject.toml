[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hits-rec"
version = "0.1.0"
description = "Prototipe modul rekomendasi lagu untuk agent penyiar HITS UNIKOM RADIO"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
